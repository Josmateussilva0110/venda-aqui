name: vendaqui_cliente
description: "Vendaqui Cliente: o cliente consulta suas compras e pagamentos nas lojas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  provider: ^6.1.5+1
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/Manrope-OFL.txt

  # Mesma fonte embutida do app do comerciante: as duas pontas do Vendaqui têm a mesma cara
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

# Ícone do app gerado a partir de design/icon/ (rode `dart run flutter_launcher_icons` ao trocar a arte)
flutter_launcher_icons:
  image_path: design/icon/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#3E7350"
  adaptive_icon_foreground: design/icon/icon_foreground.png
  adaptive_icon_monochrome: design/icon/icon_foreground.png
  # O app é só para Android
  ios: false
